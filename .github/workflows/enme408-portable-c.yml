name: ENME408 portable C parity

on:
  push:
    paths:
      - 'controller/**'
      - 'scripts/check_controller_import.py'
      - '.github/workflows/enme408-portable-c.yml'
  pull_request:
    paths:
      - 'controller/**'
      - 'scripts/check_controller_import.py'
      - '.github/workflows/enme408-portable-c.yml'

permissions:
  contents: read

jobs:
  parity:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        python: ['3.11', '3.12', '3.13']
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Require the selected host compiler
        run: $CC --version
      - name: Compile and run all reference regressions
        run: python -B -m unittest discover -s controller/reference -p "test_*.py" -q
      - name: Emit the deterministic compiled parity receipt
        run: python -B controller/reference/c_parity.py --output enme408-c-parity.json
      - name: Emit normalized-clock and composed-gate parity
        run: python -B controller/reference/clock_parity.py --output enme408-clock-parity.json
      - name: Emit trusted-pedal adapter parity
        run: python -B controller/reference/pedal_parity.py --output enme408-pedal-parity.json
      - name: Emit actual base-guard owner and proposed-pipeline parity
        run: python -B controller/reference/guard_parity.py --output enme408-guard-parity.json
      - name: Emit actual allocator owner and five-unit proposed-pipeline parity
        run: python -B controller/reference/allocator_parity.py --output enme408-allocator-parity.json
      - name: Exercise memory and undefined-behavior boundaries
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cd controller/reference/native
          $CC -std=c11 -O1 -Wall -Wextra -Werror -pedantic -fno-fast-math -fsanitize=address,undefined -fno-omit-frame-pointer torque_contract.c sanitizer_probe.c -lm -o sanitizer-probe
          ./sanitizer-probe
          $CC -std=c11 -O1 -Wall -Wextra -Werror -pedantic -fno-fast-math -fsanitize=address,undefined -fno-omit-frame-pointer torque_contract.c torque_clock.c clock_sanitizer_probe.c -lm -o clock-sanitizer-probe
          ./clock-sanitizer-probe
          $CC -std=c11 -O1 -Wall -Wextra -Werror -pedantic -fno-fast-math -fsanitize=address,undefined -fno-omit-frame-pointer torque_pedal.c pedal_sanitizer_probe.c -lm -o pedal-sanitizer-probe
          ./pedal-sanitizer-probe
          $CC -std=c11 -O1 -Wall -Wextra -Werror -pedantic -fno-fast-math -fno-finite-math-only -ffp-contract=off -fexcess-precision=standard -fsanitize=address,undefined -fno-omit-frame-pointer torque_contract.c torque_clock.c torque_pedal.c torque_guard.c guard_sanitizer_probe.c -lm -o guard-sanitizer-probe
          ./guard-sanitizer-probe
          $CC -std=c11 -O1 -Wall -Wextra -Werror -pedantic -fno-fast-math -fno-finite-math-only -ffp-contract=off -fexcess-precision=standard -fsanitize=address,undefined -fno-omit-frame-pointer torque_contract.c torque_clock.c torque_pedal.c torque_guard.c torque_allocator.c allocator_sanitizer_probe.c -lm -o allocator-sanitizer-probe
          ./allocator-sanitizer-probe
      - uses: actions/upload-artifact@v4
        with:
          name: enme408-c-parity-${{ matrix.compiler }}-py${{ matrix.python }}
          path: |
            enme408-c-parity.json
            enme408-clock-parity.json
            enme408-pedal-parity.json
            enme408-guard-parity.json
            enme408-allocator-parity.json
