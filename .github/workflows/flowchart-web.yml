name: Flowchart web checks

on:
  push:
    branches: [main, gh-pages]
    paths:
      - ".github/workflows/flowchart-web.yml"
      - ".nojekyll"
      - "index.html"
      - "docs/simulator_flowchart/**"
      - "scripts/check_flowchart_data.mjs"
      - "scripts/check_flowchart_site.py"
      - "scripts/check_public_landing.cjs"
      - "public-site.json"
      - "tournament/**"
      - "scripts/check_r11_publication.cjs"
      - "scripts/check_map_publication.cjs"
      - "scripts/check_map_browser.cjs"
      - "map-publication.json"
  pull_request:
    paths:
      - ".github/workflows/flowchart-web.yml"
      - ".nojekyll"
      - "index.html"
      - "docs/simulator_flowchart/**"
      - "scripts/check_flowchart_data.mjs"
      - "scripts/check_flowchart_site.py"
      - "scripts/check_public_landing.cjs"
      - "public-site.json"
      - "tournament/**"
      - "scripts/check_r11_publication.cjs"
      - "scripts/check_map_publication.cjs"
      - "scripts/check_map_browser.cjs"
      - "map-publication.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowchart-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check out the pinned public source for map and R11 verification
        uses: actions/checkout@v4
        with:
          ref: 6d6f355221c66047a83003ff6ccc8ccc63467c75
          path: .r11-reviewed-source
          persist-credentials: false

      - name: Verify R11 projection and canonical saved-data contracts
        run: |
          node scripts/check_r11_publication.cjs source
          node .r11-reviewed-source/scripts/test_tournament_review.cjs
          node .r11-reviewed-source/scripts/test_tournament_scoring.cjs
          node tournament/test-bundled.cjs
          for file in tournament/*.js scripts/check_r11_publication.cjs; do node --check "$file"; done

      - name: Verify unchanged source inventory and stage exact map allowlist
        run: |
          python .r11-reviewed-source/docs/simulator_flowchart/generate_inventory.py --check
          node scripts/check_map_publication.cjs
          node --check scripts/check_map_publication.cjs
          node --check scripts/check_map_browser.cjs

      - name: Validate static site files
        run: python scripts/check_flowchart_site.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find docs/simulator_flowchart -type f -name '*.js' -print0 | sort -z)

      - name: Validate graph data and source links
        run: node scripts/check_flowchart_data.mjs

      - name: Run headless-browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory . >/tmp/lapsim-flowchart-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/tmp/lapsim-root.html; then
              break
            fi
            sleep 0.2
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/docs/simulator_flowchart/styles.css >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/docs/simulator_flowchart/app.js >/dev/null

          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$chrome" ]]; then
            echo "A Chromium-compatible browser is required for the runtime smoke test." >&2
            exit 1
          fi

          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=5000 \
            --dump-dom \
            "http://127.0.0.1:4173/audit/map-runtime/#lapsim" \
            >/tmp/lapsim-flowchart-dom.html

          grep --fixed-strings 'data-node-id="lapsim"' /tmp/lapsim-flowchart-dom.html >/dev/null
          grep --fixed-strings '<h2>LapSim simulator</h2>' /tmp/lapsim-flowchart-dom.html >/dev/null
          grep --extended-regexp '[1-9][0-9]* total' /tmp/lapsim-flowchart-dom.html >/dev/null
          grep --fixed-strings 'docs/simulator_flowchart/' /tmp/lapsim-root.html >/dev/null

      - name: Check panel layout and drag resizing
        shell: bash
        run: |
          set -euo pipefail
          browser_packages="$RUNNER_TEMP/lapsim-flowchart-browser"
          npm install --prefix "$browser_packages" --no-package-lock --no-save --ignore-scripts playwright@1.62.1
          export NODE_PATH="$browser_packages/node_modules"
          export LAPSIM_BROWSER_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$LAPSIM_BROWSER_PATH" ]]; then
            echo "An installed Chromium browser is required for the layout regression." >&2
            exit 1
          fi

          python -m http.server 4174 --bind 127.0.0.1 --directory . >/tmp/lapsim-public-landing-server.log 2>&1 &
          landing_server_pid=$!
          trap 'kill "$landing_server_pid" 2>/dev/null || true' EXIT
          export LAPSIM_PUBLIC_URL="http://127.0.0.1:4174/"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$LAPSIM_PUBLIC_URL" >/dev/null; then
              break
            fi
            sleep 0.2
          done
          export LAPSIM_MAP_URL="${LAPSIM_PUBLIC_URL}audit/map-runtime/#lapsim"
          node .r11-reviewed-source/docs/simulator_flowchart/browser_layout_check.cjs
          node scripts/check_map_browser.cjs
          node scripts/check_public_landing.cjs
          node scripts/check_r11_publication.cjs browser

      - name: Upload exact staged map runtime and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-source-map-evidence
          path: |
            audit/map-runtime/
            audit/map-publication-*.json
            map-publication.json
            /tmp/lapsim-map-staged-*.png
          if-no-files-found: ignore

      - name: Upload public R11 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r11-publication-evidence
          path: |
            audit/r11-publication-*.json
            /tmp/lapsim-r11-publication-*.png
          if-no-files-found: ignore

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flowchart-browser-diagnostics
          path: |
            /tmp/lapsim-flowchart-server.log
            /tmp/lapsim-flowchart-dom.html
            /tmp/lapsim-root.html
            /tmp/lapsim-public-landing-server.log
            /tmp/lapsim-public-landing-*.png
          if-no-files-found: ignore
