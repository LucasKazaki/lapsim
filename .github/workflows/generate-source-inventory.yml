name: Generate source inventory artifact

on:
  pull_request:
    paths:
      - src/**/*.py
      - web/*.py
      - docs/simulator_flowchart/generate_inventory.py
      - .github/workflows/generate-source-inventory.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate exact source inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate inventory
        run: python docs/simulator_flowchart/generate_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: generated-source-inventory
          path: docs/simulator_flowchart/data/source-inventory.js
          if-no-files-found: error
          compression-level: 9
      - name: Create signed inventory branch
        id: commit
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          GENERATED_BRANCH: automation/source-inventory-${{ github.event.pull_request.number }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          git add docs/simulator_flowchart/data/source-inventory.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$GENERATED_BRANCH"
          git commit -s -m "Regenerate flowchart source inventory"
          git push origin "HEAD:refs/heads/$GENERATED_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$GENERATED_BRANCH" >> "$GITHUB_OUTPUT"
          echo "base=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
      - name: Open protected-branch pull request
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_BRANCH: ${{ steps.commit.outputs.branch }}
          TARGET_BRANCH: ${{ steps.commit.outputs.base }}
        run: |
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$GENERATED_BRANCH" \
            --title "Regenerate flowchart source inventory" \
            --body "Generated by the source-inventory workflow after source changes. The commit includes a DCO sign-off."
