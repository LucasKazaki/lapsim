name: License and provenance policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate license, release scope, and DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate license and public-release policy
        run: python scripts/check_license_policy.py
      - name: Enforce Developer Certificate of Origin
        if: github.event_name == 'pull_request'
        env:
          DCO_BASE: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD: ${{ github.event.pull_request.head.sha }}
          DCO_POLICY_REF: origin/${{ github.event.repository.default_branch }}
        run: >-
          python scripts/check_dco.py
          --base "$DCO_BASE"
          --head "$DCO_HEAD"
          --policy-ref "$DCO_POLICY_REF"
