name: Assemble reviewed integration candidate
on:
  pull_request:
    paths: ['.github/workflows/quality-assembly.yml', '.quality-assembly/**']
permissions:
  contents: read
jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'quality/assemble-integration-2026-10-14'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate reviewed patch package
        shell: bash
        run: |
          set -euo pipefail
          cat .quality-assembly/input.00 .quality-assembly/input.01 > /tmp/integration-input.tar.gz
          echo '050b88d474d6cad0f4f4b2f6dbb152a45565e1300d9e8e1080e784ef3e9f2c87  /tmp/integration-input.tar.gz' | sha256sum --check
          mkdir -p /tmp/integration-input /tmp/integration-evidence
          python - <<'PY'
          import tarfile
          with tarfile.open('/tmp/integration-input.tar.gz') as archive:
              archive.extractall('/tmp/integration-input', filter='data')
          PY
      - name: Reproduce reviewed merge and fixes without changing existing branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --detach 1e8e35ac64093742caafa67c118ca02efa6e6537
          python - <<'PY'
          import subprocess
          from pathlib import Path
          result = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', '651d843ad6696989a612886e867c7a4b7140dfb6'])
          conflicts = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
          if result.returncode != 1 or conflicts != ['docs/simulator_flowchart/index.html']:
              raise SystemExit(f'Unexpected merge result: {result.returncode}, conflicts={conflicts}')
          Path('docs/simulator_flowchart/index.html').write_bytes(Path('/tmp/integration-input/resolved-index.html').read_bytes())
          subprocess.run(['git', 'add', 'docs/simulator_flowchart/index.html'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Integrate portable simulator and full map while preserving PR4 anatomy'], check=True)
          PY
          git merge --no-ff 5b446bc0fd645ffaa76917af719cba99dc7298c5 -m 'Integrate five-tool audit with complete branch ancestry'
          git apply --check /tmp/integration-input/fixes.patch
          git apply /tmp/integration-input/fixes.patch
          cp -R /tmp/integration-input/extra/. .
          python docs/simulator_flowchart/generate_inventory.py
          python -m pip install ruff==0.17.0
          ruff format quality
          git add .github/workflows/quality-audit.yml docs/simulator_flowchart quality src/lapsim/core/profiles.py src/lapsim/courses/course_bundle.py tests/test_course_bundle.py tests/test_simulator_flowchart.py
          git diff --cached --check
          git commit -m 'Fix profile transitions, bounded JSON, accessible diagrams and integrated verification'
          git rev-parse HEAD > /tmp/integration-evidence/candidate-sha.txt
          git diff --stat 1e8e35ac64093742caafa67c118ca02efa6e6537 HEAD > /tmp/integration-evidence/integration-stat.txt
          git bundle create /tmp/integration-evidence/candidate.bundle HEAD
      - name: Publish only a new candidate branch for pull-request review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target='quality/integrated-review-2026-10-14'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          existing="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote --heads origin "refs/heads/$target")"
          if [[ -n "$existing" ]]; then
            echo 'Candidate branch already exists; refusing to update it directly.' >&2
            exit 1
          fi
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$target"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-integration-candidate
          path: /tmp/integration-evidence/
          if-no-files-found: error
          retention-days: 7
  offline-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip download --dest wheels ruff==0.17.0 pyright==1.1.414 hypothesis==6.169.1
      - uses: actions/upload-artifact@v4
        with:
          name: offline-quality-tools
          path: wheels/
          retention-days: 7
