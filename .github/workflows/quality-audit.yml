name: Five-tool quality audit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-audit-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg
jobs:
  source:
    name: Static review and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install -e '.[dev]' ruff==0.17.0 pyright==1.1.414
          python -m venv /tmp/lapsim-semgrep
          /tmp/lapsim-semgrep/bin/pip install semgrep==1.180.0
      - run: python quality/run_source_audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-quality-evidence
          path: audit/
          if-no-files-found: error
  properties:
    name: Generated numerical contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]' hypothesis==6.169.1
      - run: |
          set -o pipefail
          mkdir -p audit
          python -m pytest quality/test_properties.py -v --hypothesis-show-statistics --junitxml=audit/properties.xml | tee audit/properties.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-property-evidence
          path: audit/
          if-no-files-found: error
  native:
    name: Native suite / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: xvfb-run -a python quality/run_native_shard.py '${{ matrix.shard }}' 6
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-suite-${{ matrix.shard }}
          path: audit/
          if-no-files-found: error
  browser:
    name: Browser / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m pip install playwright==1.64.0
          python -m playwright install --with-deps '${{ matrix.engine }}'
          npm install --no-save --ignore-scripts axe-core@4.14.0
      - run: python quality/run_browser_audit.py '${{ matrix.engine }}'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.engine }}
          path: audit/
          if-no-files-found: error
  web-runtime:
    name: Real browser physics and native replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m pip install -e '.[dev]' playwright==1.64.0 openpyxl==3.1.5 et_xmlfile==2.0.0
          python -m playwright install --with-deps chromium
          npm install --no-save --ignore-scripts axe-core@4.14.0
          python scripts/build_web.py --output-dir dist/web
          pwsh -NoProfile -File scripts/stage_team_site.ps1 -OutputDirectory dist/web
      - run: python quality/run_web_runtime.py
      - run: python quality/run_basic_dynamics_runtime.py
      - run: python quality/run_control_study_runtime.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-browser-physics
          path: audit/
          if-no-files-found: error
  portable:
    name: Windows frozen executable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: |
          python -m pip install -r requirements-build.lock
          python -m pip install --no-deps -e .
          python scripts/build_windows.py --skip-tests
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-verification
          path: |
            dist/**/portable-self-test.json
            dist/**/checksums.json
          if-no-files-found: error
