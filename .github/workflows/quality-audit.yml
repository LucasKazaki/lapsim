name: Five-tool quality audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Python correctness and security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis tools
        run: |
          python -m pip install -e '.[dev]' ruff pyright hypothesis pytest-cov
          python -m venv /tmp/lapsim-semgrep
          /tmp/lapsim-semgrep/bin/pip install semgrep
      - name: Run all independent checks
        run: python quality/run_source_audit.py
      - name: Preserve evidence even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-quality-evidence
          path: audit/
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browser / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [current, anatomy-pr3]
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: target
          ref: ${{ matrix.target == 'anatomy-pr3' && 'c780a9678c7bc1ca6e644072c7154f6b6a67e7d4' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser checks
        working-directory: harness
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          npm install --no-save --ignore-scripts axe-core
      - name: Exercise desktop, mobile, themes, keyboard and accessibility
        working-directory: harness
        run: python quality/run_browser_audit.py ../target '${{ matrix.target }}'
      - name: Preserve screenshots and browser findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-${{ matrix.target }}
          path: harness/audit/
          if-no-files-found: error
          retention-days: 14
