name: Assemble integration remediation
on:
  pull_request:
    paths: ['.github/workflows/quality-remediation.yml', '.quality-remediation.patch']
permissions:
  contents: read
jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'quality/prepare-remediation-2026-10-14'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed fixes to the pinned candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .quality-remediation.patch /tmp/remediation.patch
          mkdir -p /tmp/remediation-evidence
          git switch --detach 28e8d93f50d6e247be2b5f251be61a9d28fc16fa
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git apply --check /tmp/remediation.patch
          git apply /tmp/remediation.patch
          python docs/simulator_flowchart/generate_inventory.py
          git add docs/simulator_flowchart quality/run_browser_audit.py src/lapsim/desktop.py src/lapsim/resources.py src/lapsim/ui/app.py
          git diff --cached --check
          git commit -m 'Fix mobile appearance, native accessible names and new type contracts'
          git rev-parse HEAD > /tmp/remediation-evidence/candidate-sha.txt
          git bundle create /tmp/remediation-evidence/candidate.bundle HEAD
      - name: Publish a new source-only candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target='quality/integrated-final-2026-10-14'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          existing="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote --heads origin "refs/heads/$target")"
          if [[ -n "$existing" ]]; then
            echo 'Refusing to update an existing branch directly.' >&2
            exit 1
          fi
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$target"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-candidate
          path: /tmp/remediation-evidence/
          if-no-files-found: error
          retention-days: 7
