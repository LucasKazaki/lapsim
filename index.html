<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive, expandable architecture and equation map for the LapSim Formula SAE simulator.">
  <meta name="robots" content="index,follow">
  <meta http-equiv="refresh" content="0; url=docs/simulator_flowchart/">
  <link rel="canonical" href="https://lucaskazaki.github.io/lapsim/docs/simulator_flowchart/">
  <title>LapSim interactive simulator flowchart</title>
  <script>
    (() => {
      const target = new URL("docs/simulator_flowchart/", window.location.href);
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
    main { max-width: 42rem; padding: 2rem; text-align: center; }
    a { font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Opening the LapSim interactive flowchart…</h1>
    <p><a href="docs/simulator_flowchart/">Open the flowchart</a> if the redirect does not start automatically.</p>
  </main>
</body>
</html>
