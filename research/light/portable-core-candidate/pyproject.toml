[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lapsim-light-core-candidate"
version = "0.0.0.dev1"
description = "Unqualified source-only portability candidate for the synthetic light plant"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["lapsim_light_core"]
namespaces = false
