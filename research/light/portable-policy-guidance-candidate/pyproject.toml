[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lapsim-light-backend-source-candidate"
version = "0.0.0.dev1"
description = "Untested portable light core, seven-policy guidance and raw storage source"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "lapsim_light_core",
    "lapsim_light_policies",
    "lapsim_light_guidance",
    "lapsim_light_campaign",
]
namespaces = false
